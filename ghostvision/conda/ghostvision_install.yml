name: ghostvision
channels:
  - conda-forge
dependencies:
  - python<3.13
  - pip
  - git
  - gdal
  - numpy
  - pandas
  - geopandas
  - pyproj
  - scikit-image
  - joblib
  - matplotlib
  - rasterio
  - h5py
  - pip:
      - psutil
      - inference
      - supervision
      - trackers[deepsort]
      - opencv-python
      - pingverter
      - pingmapper
      - pingwizard
      - pinginstaller
      - pingdetect
      - ghostvision
      - rsa