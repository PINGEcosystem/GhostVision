name: ghostvision
channels:
  - pytorch
  - conda-forge
dependencies:
  - python<3.13
  - pip
  - git
  - gdal
  - numpy
  - pandas
  - geopandas
  - pyproj
  - scikit-image
  - joblib
  - matplotlib
  - rasterio
  - h5py
  - pytorch                  # install PyTorch from pytorch channel
  - torchvision
  - torchaudio
  # put heavyweight binary deps in conda; keep the rest for pip
  - pip:
      - pingverter
      - pingmapper
      - pingwizard
      - pinginstaller
      - doodleverse_utils
      - psutil
      - transformers
      - tensorflow
      - inference
      - supervision
      - trackers[cpu]
      - trackers[deepsort]
      - opencv-python
      - rsa